name: Refresh Revolut source

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revolut-source-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fetch official careers data
        run: node scripts/refresh-revolut.mjs "$RUNNER_TEMP/revolut.json"
      - name: Publish source snapshot
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin source-data > /dev/null; then
            git fetch origin source-data
            git switch -C source-data FETCH_HEAD
          else
            git switch -c source-data
          fi
          cp "$RUNNER_TEMP/revolut.json" revolut.json
          git add revolut.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh Revolut source snapshot"
          git push origin HEAD:source-data
